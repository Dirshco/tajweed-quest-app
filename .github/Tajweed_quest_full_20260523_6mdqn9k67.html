<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TajweedQuest - Complete Learning Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #58cc02; --primary-dark: #46a302;
      --secondary: #ffc800; --danger: #ff4b4b;
      --bg: #131f24; --card: #202f36; --card-hover: #2a3b44;
      --text: #ffffff; --muted: #a5b3b9; --border: #37464f;
      --radius: 16px; --shadow: 0 6px 15px rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
    .arabic { font-family: 'Amiri', serif; font-size: 28px; line-height: 1.8; direction: rtl; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--card); position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .stat { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 15px; }
    .stat svg { width: 20px; height: 20px; }
    .xp { color: var(--secondary); } .hearts { color: var(--danger); } .streak { color: var(--primary); }

    .path-container { max-width: 500px; margin: 30px auto; padding: 0 15px 80px; display: flex; flex-direction: column; align-items: center; gap: 25px; position: relative; }
    .path-line { position: absolute; left: 50%; top: 20px; bottom: 20px; width: 4px; background: var(--border); transform: translateX(-50%); z-index: 0; }
    .rule-section { width: 100%; position: relative; z-index: 1; }
    .rule-title { background: var(--card-hover); padding: 10px 16px; border-radius: 12px; font-weight: 600; margin-bottom: 20px; text-align: center; box-shadow: var(--shadow); }
    .lesson-node { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; transition: all 0.2s; position: relative; box-shadow: var(--shadow); border: 4px solid transparent; }
    .lesson-node.completed { background: var(--primary); color: white; }
    .lesson-node.current { background: var(--primary); color: white; border-color: var(--secondary); transform: scale(1.1); animation: float 2s infinite ease-in-out; }
    @keyframes float { 0%, 100% { transform: scale(1.1) translateY(0); } 50% { transform: scale(1.1) translateY(-5px); } }
    .lesson-node.locked { background: var(--card-hover); color: var(--muted); cursor: not-allowed; }
    .lesson-node:hover:not(.locked) { transform: scale(1.05); }
    .lesson-label { position: absolute; bottom: -22px; font-size: 12px; color: var(--muted); white-space: nowrap; }
    .path-row { display: flex; justify-content: center; width: 100%; margin-bottom: 10px; }
    .path-row:nth-child(even) { justify-content: flex-start; padding-left: 15%; }
    .path-row:nth-child(odd) { justify-content: flex-end; padding-right: 15%; }

    .modal { position: fixed; inset: 0; background: var(--bg); z-index: 200; display: none; flex-direction: column; animation: slideUp 0.3s ease; }
    .modal.active { display: flex; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--card); }
    .close-btn { background: none; border: none; color: var(--muted); font-size: 24px; cursor: pointer; padding: 5px; }
    .progress-bar { flex: 1; height: 8px; background: var(--border); border-radius: 4px; margin: 0 15px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--primary); transition: width 0.3s ease; width: 0%; }
    
    .question-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; overflow-y: auto; }
    .q-title { font-size: 20px; margin-bottom: 15px; }
    .q-arabic { font-size: 32px; margin-bottom: 20px; color: var(--secondary); }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 400px; margin-bottom: 20px; }
    .option-btn { background: var(--card); border: 2px solid var(--border); border-radius: 12px; padding: 14px; cursor: pointer; font-size: 15px; color: var(--text); transition: 0.2s; display: flex; align-items: center; justify-content: center; min-height: 56px; }
    .option-btn:hover { border-color: var(--primary); background: var(--card-hover); }
    .option-btn.selected { border-color: var(--primary); background: rgba(88, 204, 2, 0.2); }
    .option-btn.correct { border-color: var(--primary); background: var(--primary); color: white; }
    .option-btn.wrong { border-color: var(--danger); background: var(--danger); color: white; opacity: 0.8; }
    .option-btn:disabled { cursor: default; opacity: 0.7; }

    .check-btn { background: var(--primary); color: white; border: none; padding: 14px; width: 90%; max-width: 400px; border-radius: 12px; font-size: 16px; font-weight: 600; margin: 0 auto 20px; cursor: pointer; box-shadow: 0 4px 0 var(--primary-dark); transition: all 0.1s; }
    .check-btn:active { transform: translateY(4px); box-shadow: none; }
    .check-btn:disabled { background: var(--card-hover); color: var(--muted); box-shadow: none; cursor: not-allowed; }

    .feedback-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 20px; background: var(--card); border-top: 2px solid var(--border); transform: translateY(100%); transition: transform 0.3s ease; z-index: 210; }
    .feedback-bar.show { transform: translateY(0); }
    .feedback-bar.correct { border-top-color: var(--primary); background: #1a2a1a; }
    .feedback-bar.wrong { border-top-color: var(--danger); background: #2a1a1a; }
    .fb-content { display: flex; flex-direction: column; gap: 10px; max-width: 500px; margin: 0 auto; }
    .fb-text { font-weight: 600; font-size: 16px; }
    .fb-explanation { font-size: 14px; color: var(--muted); line-height: 1.6; }
    .fb-example { background: var(--card-hover); padding: 10px; border-radius: 8px; margin-top: 8px; font-size: 13px; }
    .continue-btn { padding: 10px 24px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; align-self: flex-end; }
    .feedback-bar.correct .continue-btn { background: var(--primary); color: white; }
    .feedback-bar.wrong .continue-btn { background: var(--danger); color: white; }

    .result-screen { text-align: center; padding: 40px 20px; }
    .result-screen h2 { font-size: 28px; margin-bottom: 10px; }
    .result-screen p { color: var(--muted); margin-bottom: 25px; }
    .xp-badge { background: var(--card); padding: 15px; border-radius: 16px; display: inline-block; margin-bottom: 20px; }
    .xp-badge span { color: var(--secondary); font-size: 24px; font-weight: bold; }

    .resource-links { margin-top: 15px; padding: 15px; background: var(--card-hover); border-radius: 12px; }
    .resource-links h4 { margin-bottom: 10px; color: var(--secondary); }
    .resource-links a { display: block; color: var(--primary); text-decoration: none; margin: 5px 0; font-size: 14px; }
    .resource-links a:hover { text-decoration: underline; }

    .lesson-intro { background: var(--card-hover); padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: left; }
    .lesson-intro h3 { color: var(--secondary); margin-bottom: 10px; }
    .lesson-intro p { margin: 8px 0; line-height: 1.6; }
    .example-box { background: var(--card); padding: 12px; border-radius: 8px; margin: 10px 0; border-left: 3px solid var(--primary); }

    @media (max-width: 600px) {
      .options-grid { grid-template-columns: 1fr; }
      .lesson-node { width: 56px; height: 56px; font-size: 20px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="stat streak"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C8 2 5 5 5 9c0 3 2 5 3 7s4 6 4 6 3-4 4-6 3-4 3-7c0-4-3-7-7-7zm0 12c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg> <span id="streak-val">1</span></div>
    <div class="stat xp"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2L1 21h22L12 2zm0 4l7.53 12H4.47L12 6zm-1 5v2h2v-2h-2z"/></svg> <span id="xp-val">0</span> XP</div>
    <div class="stat hearts"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg> <span id="hearts-val">5</span></div>
  </header>

  <main id="path-view" class="path-container">
    <div class="path-line"></div>
  </main>

  <div id="lesson-modal" class="modal">
    <div class="modal-header">
      <button class="close-btn" onclick="closeLesson()">✕</button>
      <div class="progress-bar"><div id="lesson-progress" class="progress-fill"></div></div>
    </div>
    <div id="question-container" class="question-area"></div>
    <button id="check-btn" class="check-btn" disabled onclick="submitAnswer()">CHECK</button>
  </div>

  <div id="feedback-bar" class="feedback-bar">
    <div class="fb-content">
      <div>
        <div id="fb-text" class="fb-text"></div>
        <div id="fb-explanation" class="fb-explanation"></div>
        <div id="fb-example" class="fb-example"></div>
      </div>
      <button id="continue-btn" class="continue-btn" onclick="nextQuestion()">CONTINUE</button>
    </div>
  </div>

  <div id="result-screen" class="modal">
    <div class="result-screen">
      <h2 id="res-title"></h2>
      <div class="xp-badge">+<span id="res-xp">0</span> XP</div>
      <p id="res-msg"></p>
      <button class="check-btn" onclick="closeResult()">CONTINUE</button>
    </div>
  </div>

<script>
  // === ENHANCED CURRICULUM WITH MULTIPLE QUESTIONS, EXAMPLES & RESOURCES ===

            { type: "mc", q: "In 'مِنْ بَعْدِ', the rule is:", options: ["Izhar", "Iqlab", "Idgham", "Ikhfa"], ans: 1, explanation: "ب after نْ converts noon to meem = Iqlab.", example: "مِنْ بَعْدِ = mim ba'di (ن becomes م)" }

  // === STATE MANAGEMENT ===
  const DEFAULT_STATE = { xp: 0, streak: 1, hearts: 5, completed: [], currentLesson: 0, questionIndex: 0 };
  let state = JSON.parse(localStorage.getItem('tq_state')) || DEFAULT_STATE;
  let currentLesson = null;
  let currentQuestion = null;
  let selectedOption = null;
  let isAnswered = false;

  function saveState() { localStorage.setItem('tq_state', JSON.stringify(state)); updateHeader(); }
  function updateHeader() {
    document.getElementById('xp-val').textContent = state.xp;
    document.getElementById('streak-val').textContent = state.streak;
    document.getElementById('hearts-val').textContent = state.hearts;
  }

  // === PATH RENDERER ===
  function renderPath() {
    const container = document.getElementById('path-view');
    container.innerHTML = '<div class="path-line"></div>';
    let lessonCounter = 0;
    const totalLessons = CURRICULUM.reduce((a,r)=>a+r.lessons.length, 0);

    CURRICULUM.forEach((rule, rIdx) => {
      const section = document.createElement('div');
      section.className = 'rule-section';
      section.innerHTML = `<div class="rule-title">${rule.title}</div>`;
      
      rule.lessons.forEach((lesson, lIdx) => {
        const globalIdx = lessonCounter++;
        const id = `${rule.id}-${lesson.id}`;
        const isCompleted = state.completed.includes(id);
        const isCurrent = globalIdx === (state.completed.length === totalLessons ? totalLessons - 1 : state.completed.length);
        const isLocked = !isCompleted && !isCurrent;
        
        const status = isCompleted ? 'completed' : isCurrent ? 'current' : 'locked';
        const icon = isCompleted ? '✓' : isCurrent ? '▶' : '🔒';
        
        const node = document.createElement('div');
        node.className = `path-row`;
        node.innerHTML = `
          <div class="lesson-node ${status}" onclick="${isLocked ? '' : `startLesson(${rIdx}, ${lIdx})`}">
            ${icon}
            <span class="lesson-label">L${lesson.id}</span>
          </div>
        `;
        section.appendChild(node);
      });
      container.appendChild(section);
    });
  }

  // === LESSON ENGINE ===
  function startLesson(rIdx, lIdx) {
    if(state.hearts <= 0) return showGameOver();
    currentLesson = CURRICULUM[rIdx].lessons[lIdx];
    state.currentLesson = `${rIdx}-${lIdx}`;
    state.questionIndex = 0;
    selectedOption = null;
    isAnswered = false;
    
    document.getElementById('lesson-modal').classList.add('active');
    const totalQ = currentLesson.questions.length;
    const completedQ = state.completed.filter(id => id.startsWith(`${CURRICULUM[rIdx].id}-${currentLesson.id}`)).length;
    document.getElementById('lesson-progress').style.width = `${((state.completed.length) / (CURRICULUM.reduce((a,r)=>a+r.lessons.length, 0))) * 100}%`;
    
    showLessonIntro();
  }

  function showLessonIntro() {
    const container = document.getElementById('question-container');
    document.getElementById('check-btn').textContent = 'START LESSON';
    document.getElementById('check-btn').disabled = false;
    document.getElementById('check-btn').onclick = startFirstQuestion;
    
    const l = currentLesson;
    let html = `
      <div class="lesson-intro">
        <h3>${l.title}</h3>
        <p>${l.intro}</p>
        <div class="example-box">
          <strong>Examples:</strong><br>
          ${l.examples.map(ex => `<span class="arabic">${ex}</span>`).join(' | ')}
        </div>
      </div>
      <p style="color:var(--muted); margin-top:20px;">${l.questions.length} questions to complete</p>
    `;
    container.innerHTML = html;
  }

  function startFirstQuestion() {
    document.getElementById('check-btn').onclick = submitAnswer;
    loadQuestion(0);
  }

  function loadQuestion(idx) {
    state.questionIndex = idx;
    currentQuestion = currentLesson.questions[idx];
    isAnswered = false;
    selectedOption = null;
    
    const container = document.getElementById('question-container');
    document.getElementById('check-btn').disabled = true;
    document.getElementById('check-btn').textContent = 'CHECK';
    document.getElementById('feedback-bar').classList.remove('show');
    
    let html = `<h2 class="q-title">Question ${idx + 1} of ${currentLesson.questions.length}</h2>`;
    html += `<p style="color:var(--muted); margin-bottom:15px;">${currentQuestion.q}</p>`;
    
    if(currentQuestion.type === 'mc') {
      html += `<div class="options-grid">
        ${currentQuestion.options.map((opt, i) => `<button class="option-btn" onclick="selectOption(this, ${i})">${opt}</button>`).join('')}
      </div>`;
    } else if(currentQuestion.type === 'fill') {
      html += `<input type="text" id="fill-input" class="option-btn" style="width:100%; max-width:300px; margin:0 auto 20px; font-size:24px; text-align:center;" placeholder="Type answer..." oninput="validateFill(this.value)" autocomplete="off">`;
    }
    container.innerHTML = html;
  }

  function selectOption(el, idx) {
    if(isAnswered) return;
    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
    selectedOption = idx;
    document.getElementById('check-btn').disabled = false;
  }

  function validateFill(val) {
    document.getElementById('check-btn').disabled = val.trim().length < 1;
  }

  function submitAnswer() {
    if(isAnswered) return;
    isAnswered = true;
    let isCorrect = false;
    
    if(currentQuestion.type === 'mc') {
      isCorrect = selectedOption === currentQuestion.ans;
      const btns = document.querySelectorAll('.option-btn');
      btns[currentQuestion.ans].classList.add('correct');
      if(!isCorrect && selectedOption !== null) btns[selectedOption].classList.add('wrong');
    } else if(currentQuestion.type === 'fill') {
      const val = document.getElementById('fill-input').value.trim();
      isCorrect = val === currentQuestion.ans;
      document.getElementById('fill-input').style.borderColor = isCorrect ? 'var(--primary)' : 'var(--danger)';
    }

    showFeedback(isCorrect);
  }

  function showFeedback(correct) {
    const bar = document.getElementById('feedback-bar');
    const txt = document.getElementById('fb-text');
    const exp = document.getElementById('fb-explanation');
    const ex = document.getElementById('fb-example');
    
    bar.className = `feedback-bar show ${correct ? 'correct' : 'wrong'}`;
    txt.textContent = correct ? '✅ Excellent!' : '❌ Not quite right.';
    exp.textContent = currentQuestion.explanation;
    ex.innerHTML = `<strong>Example:</strong> ${currentQuestion.example}`;
    
    if(!correct) {
      state.hearts = Math.max(0, state.hearts - 1);
      saveState();
    }
  }

  function nextQuestion() {
    const bar = document.getElementById('feedback-bar');
    bar.classList.remove('show');
    
    if(state.hearts <= 0) { closeLesson(); showGameOver(); return; }
    
    const nextIdx = state.questionIndex + 1;
    if(nextIdx < currentLesson.questions.length) {
      loadQuestion(nextIdx);
    } else {
      // Lesson complete
      const id = `${CURRICULUM.find(r => r.lessons.includes(currentLesson)).id}-${currentLesson.id}`;
      if(!state.completed.includes(id)) {
        state.completed.push(id);
        state.xp += currentLesson.questions.length * 5;
        saveState();
      }
      closeLesson();
      showComplete();
    }
  }

  function closeLesson() {
    document.getElementById('lesson-modal').classList.remove('active');
    renderPath();
  }

  function showComplete() {
    document.getElementById('res-title').textContent = '🎉 Lesson Complete!';
    document.getElementById('res-xp').textContent = `+${currentLesson.questions.length * 5}`;
    document.getElementById('res-msg').textContent = `You mastered ${currentLesson.title}! Keep up the great work.`;
    document.getElementById('result-screen').classList.add('active');
  }

  function showGameOver() {
    document.getElementById('res-title').textContent = '💔 Out of Hearts';
    document.getElementById('res-xp').textContent = '0';
    document.getElementById('res-msg').textContent = 'Take a break and review the rules, then try again!';
    document.getElementById('result-screen').classList.add('active');
  }

  function closeResult() {
    document.getElementById('result-screen').classList.remove('active');
    renderPath();
    if(state.hearts === 0) {
      setTimeout(() => { state.hearts = 5; saveState(); }, 1000);
    }
  }

  // === INIT ===
  renderPath();
  updateHeader();
</script>

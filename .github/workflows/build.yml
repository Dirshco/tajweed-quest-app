name: Build Android APK (Capacitor Debug Mode)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: DEBUG STEP 1 - Scan Repository Files
      run: |
        echo "============================================="
        echo "🔍 STARTING DEBUG STEP 1: Repository File Scan"
        echo "Current Workspace Path: $(pwd)"
        echo "---------------------------------------------"
        echo "📁 LISTING ALL FILES AND FOLDERS IN REPOSITORY:"
        ls -R
        echo "============================================="

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Set up Java JDK 21
      id: setup-java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: DEBUG STEP 2 - Create Web App Scaffold
      run: |
        echo "============================================="
        echo "⚙️ STARTING DEBUG STEP 2: Creating Web Scaffold"
        
        npm init -y
        npm install @capacitor/core @capacitor/cli
        mkdir -p www
        
        HTML_FILE=$(find . -name "*.html" ! -path "*/node_modules/*" | head -n 1)
        
        if [ -z "$HTML_FILE" ]; then
          echo "❌ ERROR: Could not find any HTML file in this repository!"
          exit 1
        else
          echo "✅ Found HTML File at: $HTML_FILE"
          cp "$HTML_FILE" www/index.html
        fi
        
        npx cap init TajweedQuest org.learning.tajweedquest --web-dir=www
        echo "🎉 DEBUG STEP 2 COMPLETED SUCCESSFULLY."
        echo "============================================="

    - name: DEBUG STEP 3 - Add Android Mobile Platform
      run: |
        echo "============================================="
        echo "🤖 STARTING DEBUG STEP 3: Adding Android Platform"
        
        npm install @capacitor/android
        npx cap add android
        
        echo "🎉 DEBUG STEP 3 COMPLETED SUCCESSFULLY."
        echo "============================================="

    - name: DEBUG STEP 4 - Build and Sync Android Assets
      run: |
        echo "============================================="
        echo "🔄 STARTING DEBUG STEP 4: Capacitor Sync"
        
        npx cap sync android
        
        echo "🎉 DEBUG STEP 4 COMPLETED SUCCESSFULLY."
        echo "============================================="

    - name: DEBUG STEP 5 - Compile App Debug APK
      run: |
        echo "============================================="
        echo "🏗️ STARTING DEBUG STEP 5: Gradle Compilation"
        
        # FORCE: Explicitly link Java 21 to the current workspace step
        export JAVA_HOME=${{ steps.setup-java.outputs.path }}
        export PATH=$JAVA_HOME/bin:$PATH
        
        echo "Testing active Java compiler version..."
        javac -version
        
        cd android
        echo "-> Setting executable permissions on Gradle..."
        chmod +x gradlew
        
        echo "-> Booting up local gradlew compile engine..."
        ./gradlew assembleDebug
        
        echo "🎉 DEBUG STEP 5 COMPLETED SUCCESSFULLY."
        echo "============================================="

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: TajweedQuest-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build Android APK (Capacitor Native Approach)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Create Web App Scaffold
      run: |
        # 1. Initialize package structure
        npm init -y
        
        # 2. Install Capacitor Core and CLI dependencies
        npm install @capacitor/core @capacitor/cli
        
        # 3. Create web asset destination folder
        mkdir -p www
        
        # 4. DEEP SEARCH: Look everywhere in the repo for any HTML file and copy it safely
        find . -name "*.html" ! -path "*/node_modules/*" -exec cp {} www/index.html \; -quit
        
        # 5. Fallback validation: Verify that the file was actually found and moved
        if [ ! -f www/index.html ]; then
          echo "❌ ERROR: No HTML file found anywhere in your repository!"
          exit 1
        fi
        
        # 6. Initialize Capacitor configurations natively
        npx cap init TajweedQuest org.learning.tajweedquest --web-dir=www

    - name: Add Android Mobile Platform
      run: |
        npm install @capacitor/android
        npx cap add android

    - name: Build and Sync Android Assets
      run: |
        npx cap sync android

    - name: Compile App Debug APK
      run: |
        cd android && ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: TajweedQuest-Native-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

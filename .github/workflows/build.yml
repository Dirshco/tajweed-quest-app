name: Build Android APK (Capacitor Native Approach)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Create Web App Scaffold
      run: |
        # 1. Initialize a blank package structure
        npm init -y
        
        # 2. Install Capacitor Core and CLI dependencies
        npm install @capacitor/core @capacitor/cli
        
        # 3. Create the standard web asset folder required by mobile apps
        mkdir -p www
        
        # 4. Copy your Tajweed HTML file directly into the folder as index.html
        cp Tajweed_quest_full_20260523_6mdqn9k67.html www/index.html
        
        # 5. Initialize Capacitor configurations natively
        npx cap init TajweedQuest org.learning.tajweedquest --web-dir=www

    - name: Add Android Mobile Platform
      run: |
        npm install @capacitor/android
        npx cap add android

    - name: Build and Sync Android Assets
      run: |
        npx cap sync android

    - name: Compile App Debug APK
      run: |
        cd android && ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: TajweedQuest-Native-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

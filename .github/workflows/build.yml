name: Build Android APK (Cordova Approach)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js (Modern Version)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK Tools
      uses: android-actions/setup-android@v3

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project and Package App
      run: |
        # 1. Create a temporary mobile project wrapper
        cordova create tajweed_project org.learning.tajweedquest TajweedQuest
        cd tajweed_project
        
        # 2. Add Android platform support
        cordova platform add android
        
        # 3. Clean out default placeholder files
        rm -rf www/*
        
        # 4. Copy your Tajweed HTML file into the app and name it index.html (required by mobile devices)
        cp ../Tajweed_quest_full_20260523_6mdqn9k67.html www/index.html
        
        # 5. Compile the Android application package
        cordova build android --device

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: TajweedQuest-Cordova-APK
        path: tajweed_project/platforms/android/app/build/outputs/apk/debug/app-debug.apk
